# Supuestos de los escenarios (proyecciones), compartidos por los KPIs 1.2, 1.3 y 2.2.
# Un solo lugar para cambiarlos: Scripts/15 (KPI 1.3), Scripts/22 (sensibilidad del punto crítico) y el dashboard leen este archivo.
# Las proyecciones son escenarios, no pronósticos.

crecimiento_salario_real:          # crecimiento real anual del ingreso imponible por cotizante
  base: 0.01                       # escenario base de los KPIs 1.2 y 1.3
  variantes: [0.0, 0.015]          # sensibilidad (KPI 1.3: líneas punteadas; KPI 1.2: filas de la tabla de sensibilidad)

cobertura_constante: true          # cotizantes / población 15-64 se mantiene en el valor del año base
beneficio_real_constante: true     # gasto PGU/PBS/APS por persona de 65+ constante en pesos reales (la PGU se reajusta por IPC)
pgu_250: true                      # aumento de la PGU a $250.000 según el calendario de la Ley 21.735 (KPI 1.2 y 2.2)

tope_carga:                        # KPI 1.2: parte del sueldo que se acepta destinar al Pilar Solidario
  base: 0.10                       # 10% = la cotización obligatoria para pensión
  variantes: [0.08, 0.12]          # columnas de la tabla de sensibilidad del punto crítico

crecimiento_pib_real: 0.02         # KPI 2.1 y 2.2: crecimiento real anual del PIB (valor inicial del control deslizante)
# OJO (revisado 2026-10-18): no es del todo consistente con crecimiento_salario_real. El KPI 2.1 hace crecer el ingreso de
# los ocupados como el PIB per cápita (≈ +2,0% real al año, porque la población total casi no crece: -0,04% anual 2025-2050),
# mientras los KPI 1.2 y 1.3 usan +1% de salario real. Con empleo ≈ población 15-64 (+0,35% anual a 2035, -0,39% a 2050),
# PIB +2% implicaría salario real de ≈ +1,6% a +2,4%. Se deja así a propósito: el +1% es conservador para la capacidad de
# pago (KPI 1.2) y el +2% es el supuesto habitual de PIB; la diferencia se declara en el informe.

# KPI 2.2: reservas y peso fiscal
rentabilidad_real_reservas:        # rentabilidad real anual de la reserva y tasa de descuento del valor presente (ratio 2)
  base: 0.025                      # 2,53% real: tasa del préstamo del FRP al FAPP (DIPRES, Resolución Exenta 646 de 2025)
  variantes: [0.015, 0.035]        # tabla de sensibilidad (Scripts/23)
aporte_fapp: true                  # sumar el aporte del Estado al FAPP por ley (Ley 21.735, desde 2028)
horizonte_proyeccion: 2050         # último año de las proyecciones de los KPI 2.1 y 2.2
# Población 65+: proyecciones INE base 2024 (no es un supuesto de este archivo). La invalidez se mantiene constante en términos reales.
