# Mapa de la presentación: diapositiva -> figuras -> mensaje, subtítulo, fuente y cambios.
# Lo lee Scripts/34_exportar_figuras_presentacion.py (exporta Outputs/figuras_pptx/).
#
# Campos de cada figura
#   id           número que se cita (dashboard: se recalcula con components/numeracion.numero(key) y debe coincidir; nuevas: N.x)
#   key          clave del dashboard («1.2/rs_pais») o null para las figuras nuevas
#   version      final | extendida (2.4.x solo existe en la extendida)
#   canvas       W 1600×720 · H 780×720 · F 1600×880 · T 1600×90 (franja) · R 1600×220 (fila de recuadros) · M 1600×470 (media diapositiva)
#   role         main | supporting | backup | appendix | context | optional | alternative
#   transform    función del script que arma la figura de la diapositiva
#   message      titular de la diapositiva (≤ 25 palabras, sin siglas); va en la variante «standalone»
#   subtitle     qué se mide, unidad y período (una línea, va dentro de la figura en ambas variantes)
#   source       nota de fuente y advertencia (≤ 2 líneas), se imprime abajo a la izquierda
#   nature       dato | escenario | juicio | mixto | proceso (el control exige la advertencia que corresponde en la nota)
#   status       done | needs_data | blocked | superseded (reemplazada por otra figura; se exporta igual y queda como respaldo)
#   params       opciones de la transformación (p. ej. con_perdedoras)
#   changes      cambios aplicados frente al dashboard (van al manifest y al informe de calidad)
#   notes        decisiones y diferencias con el pedido

salida: Outputs/figuras_pptx
lienzos:
  W: [1600, 720]
  H: [780, 720]
  F: [1600, 880]
  T: [1600, 90]
  R: [1600, 300]
  M: [1600, 470]   # media diapositiva (abajo): esquemas simples
  A: [1600, 1250]   # tabla de anexo a página completa (1.1.33 completa: 8 columnas de texto no caben en F con letra ≥ 20 px)
escala: 3
ancho_min_px: 4680

diapositivas:
  - {id: S04, carpeta: S04_demografia, parte: Introducción, titulo: "Demografía: menos personas aportan al sistema"}
  - {id: S05, carpeta: S05_cobertura_y_carga, parte: Introducción / conflicto, titulo: "Cobertura estancada: más carga por cada cotizante"}
  - {id: S06, carpeta: S06_punto_critico, parte: Desarrollo, titulo: "¿Cuándo deja de ser sostenible?"}
  - {id: S07, carpeta: S07_administradora, parte: Desarrollo, titulo: "¿Qué le pasa a la administradora?"}
  - {id: S08, carpeta: S08_modelo_de_negocio, parte: Desarrollo, titulo: "¿Cómo puede resistir el modelo de negocio?"}
  - {id: S09, carpeta: S09_diez_pasos, parte: Método, titulo: "Los 10 pasos del proyecto"}
  - {id: S10, carpeta: S10_datos_por_paso, parte: Método, titulo: "Qué datos necesita cada paso"}
  - {id: S11, carpeta: S11_pipeline, parte: Método, titulo: "De la fuente cruda al indicador"}
  - {id: S12, carpeta: S12_limpieza, parte: Método, titulo: "Limpiar un dato: un ejemplo"}
  - {id: S13, carpeta: S13_regiones_criticas, parte: Conflicto, titulo: "Factores de selección y regiones críticas"}
  - {id: S13-S19, carpeta: S13-S19_seguimiento, parte: Conflicto a resolución, titulo: "Franja de seguimiento (dónde estamos en el análisis)"}
  - {id: S14, carpeta: S14_causa_X, parte: Clímax, titulo: "La razón más grave: ocupados que no cotizan"}
  - {id: S15, carpeta: S15_palancas, parte: Llamado a la acción, titulo: "Qué hace la administradora y qué debe pedir al Estado"}
  - {id: S16, carpeta: S16_pronostico_X, parte: Resolución, titulo: "Qué pasa si se actúa sobre la informalidad"}
  - {id: S17, carpeta: S17_causa_Y, parte: Conflicto, titulo: "Segunda razón: participación laboral"}
  - {id: S18, carpeta: S18_palanca_Y, parte: Llamado a la acción, titulo: "Quién mueve la participación laboral"}
  - {id: S19, carpeta: S19_pronostico_Y, parte: Resolución, titulo: "Escenario de participación (pendiente)"}

